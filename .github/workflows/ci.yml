name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-18 clang-tidy-18 clang-format-18 cppcheck ninja-build cmake
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
      - name: Lint
        run: tools/lint.sh

  host-tests:
    name: Host tests (${{ matrix.cc }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   mode: sanitize, flags: -DPT_SANITIZE=ON }
          - { cc: clang, mode: sanitize, flags: -DPT_SANITIZE=ON }
          - { cc: gcc,   mode: coverage, flags: -DPT_COVERAGE=ON }
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build cmake gcovr clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        if: matrix.mode == 'coverage'
        run: |
          gcovr -r . --filter core/src --filter core/crypto --print-summary --xml coverage.xml --html-details coverage.html
      - name: Upload coverage
        if: matrix.mode == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage*.html
