name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-18 clang-tidy-18 clang-format-18 cppcheck ninja-build cmake
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
      - name: Lint
        run: tools/lint.sh

  host-tests:
    name: Host tests (${{ matrix.cc }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   mode: sanitize, flags: -DPT_SANITIZE=ON }
          - { cc: clang, mode: sanitize, flags: -DPT_SANITIZE=ON }
          - { cc: gcc,   mode: coverage, flags: -DPT_COVERAGE=ON }
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build cmake gcovr clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        if: matrix.mode == 'coverage'
        run: |
          gcovr -r . --filter core/src --filter core/crypto --print-summary --xml coverage.xml --html-details coverage.html
      - name: Upload coverage
        if: matrix.mode == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage*.html

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [json, b64url, jwk, tang, http, web, dns]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-18 libclang-rt-18-dev ninja-build cmake
      - name: Build fuzzers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 -DPT_FUZZ=ON -DBUILD_TESTING=OFF
          cmake --build build --target fuzz_${{ matrix.target }}
      - name: Fuzz for 60 s
        run: |
          mkdir -p corpus && cp core/fuzz/corpus/${{ matrix.target }}/* corpus/
          build/core/fuzz/fuzz_${{ matrix.target }} -max_total_time=60 -max_len=4096 -timeout=10 corpus
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            crash-*
            timeout-*
            leak-*

  interop:
    name: Clevis / upstream tang interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clevis, tang, jose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            ninja-build cmake gcc clevis clevis-luks tang jose jq socat curl cryptsetup
      - name: Build tangd-host
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
          cmake --build build --target tangd-host
      - name: Interop suite (incl. LUKS2 bind/unlock)
        run: sudo -E env "PATH=$PATH" tools/interop.sh --host-bin build/host/tangd-host
