name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_VERSION: v5.5.6

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3, esp32s3]
        profile: [default, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: firmware
          command: |
            DEFAULTS="sdkconfig.defaults"
            if [ "${{ matrix.profile }}" != "default" ]; then
              for p in $(echo "${{ matrix.profile }}" | tr '+' ' '); do DEFAULTS="$DEFAULTS;profiles/sdkconfig.$p.defaults"; done
            fi
            idf.py -B build -DSDKCONFIG=build/sdkconfig -DSDKCONFIG_DEFAULTS="$DEFAULTS" set-target ${{ matrix.target }} build
            idf.py -B build size
      - name: Release images must not contain the test console
        if: matrix.profile != 'test'
        run: |
          if grep -q "^CONFIG_PT_TEST_CONSOLE=y" firmware/build/sdkconfig; then echo "test console enabled"; exit 1; fi
          if grep -aq "TEST CONSOLE ENABLED" firmware/build/pocket-tang.bin; then echo "test console code linked"; exit 1; fi
          echo "OK: no test console in ${{ matrix.target }}/${{ matrix.profile }}"
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp firmware/build/pocket-tang.bin firmware/build/bootloader/bootloader.bin firmware/build/partition_table/partition-table.bin firmware/build/flasher_args.json firmware/build/sdkconfig out/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-${{ matrix.profile }}
          path: out
