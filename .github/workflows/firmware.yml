name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_VERSION: v5.5.6

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3, esp32s3]
        profile: [default, test, secure-sbv2]
        include:
          - target: esp32
            profile: secure-esp32-sbv1
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway signing key (build validation only, never used on a device)
        if: startsWith(matrix.profile, 'secure')
        run: |
          pip install --quiet esptool
          cd firmware
          espsecure generate-signing-key --version 2 --scheme rsa3072 secure_boot_signing_key.pem
          espsecure generate-signing-key --version 1 secure_boot_signing_key_v1.pem
      - name: Combine sdkconfig defaults for the profile
        run: |
          cd firmware
          # Same precedence as ESP-IDF's list handling: base, base.<target>, then each profile.
          cat sdkconfig.defaults "sdkconfig.defaults.${{ matrix.target }}" > sdkconfig.ci.defaults
          if [ "${{ matrix.profile }}" != "default" ]; then
            for p in $(echo "${{ matrix.profile }}" | tr '+' ' '); do
              cat "profiles/sdkconfig.$p.defaults" >> sdkconfig.ci.defaults
            done
          fi
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: firmware
          command: idf.py -B build -DSDKCONFIG=build/sdkconfig -DSDKCONFIG_DEFAULTS=sdkconfig.ci.defaults set-target ${{ matrix.target }} build size
      - name: Release images must not contain the test console
        if: matrix.profile != 'test'
        run: |
          if grep -q "^CONFIG_PT_TEST_CONSOLE=y" firmware/build/sdkconfig; then echo "test console enabled"; exit 1; fi
          if grep -aq "TEST CONSOLE ENABLED" firmware/build/pocket-tang.bin; then echo "test console code linked"; exit 1; fi
          echo "OK: no test console in ${{ matrix.target }}/${{ matrix.profile }}"
      - name: Secure profile really enables Secure Boot, flash and NVS encryption
        if: startsWith(matrix.profile, 'secure')
        run: |
          for opt in CONFIG_SECURE_BOOT=y CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y CONFIG_NVS_ENCRYPTION=y; do
            grep -q "^$opt$" firmware/build/sdkconfig || { echo "missing $opt"; exit 1; }
          done
          case "${{ matrix.profile }}" in
            secure-sbv2) want=CONFIG_SECURE_BOOT_V2_ENABLED=y ;;
            secure-esp32-sbv1) want=CONFIG_SECURE_BOOT_V1_ENABLED=y ;;
          esac
          grep -q "^$want$" firmware/build/sdkconfig || { echo "expected $want"; exit 1; }
      - name: Remove signing keys
        if: always() && startsWith(matrix.profile, 'secure')
        run: rm -f firmware/secure_boot_signing_key*.pem
      # Secure-profile images are signed with a throwaway key: never publish them.
      - name: Collect artifacts
        if: ${{ !startsWith(matrix.profile, 'secure') }}
        run: |
          mkdir -p out
          cp firmware/build/pocket-tang.bin firmware/build/bootloader/bootloader.bin firmware/build/partition_table/partition-table.bin firmware/build/flasher_args.json firmware/build/sdkconfig out/
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(matrix.profile, 'secure') }}
        with:
          name: firmware-${{ matrix.target }}-${{ matrix.profile }}
          path: out
