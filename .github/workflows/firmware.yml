name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_VERSION: v5.5.6

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3, esp32s3]
        profile: [default]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: firmware
          command: |
            if [ "${{ matrix.profile }}" = "default" ]; then DEFAULTS="sdkconfig.defaults"; else DEFAULTS="sdkconfig.defaults;profiles/sdkconfig.${{ matrix.profile }}.defaults"; fi
            idf.py -B build -DSDKCONFIG_DEFAULTS="$DEFAULTS" set-target ${{ matrix.target }} build size-components
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp firmware/build/pocket-tang.bin firmware/build/bootloader/bootloader.bin firmware/build/partition_table/partition-table.bin firmware/build/flasher_args.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-${{ matrix.profile }}
          path: out
